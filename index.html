/* DSA hierarchy */
.dsa-metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;margin:0 0 15px}
.dsa-metrics>div{border:1px solid var(--line);background:#fff;border-radius:13px;padding:15px 12px;display:grid;gap:2px}
.dsa-metrics strong{font-size:21px;font-weight:840;color:#2d3d61;letter-spacing:-.5px}
.dsa-metrics span{color:#8c98af;font-size:11px}
.dsa-workbench{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:18px}
.dsa-workbench-intro{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-wrap:wrap;margin-bottom:16px}
.dsa-workbench-intro strong{font-size:14px}
.dsa-workbench-intro p{color:#8895a9;margin:3px 0;font-size:11px}
.dsa-workbench .searchline{margin-bottom:8px}
.dsa-fold-actions{display:flex;gap:6px;flex-wrap:wrap}
.dsa-legend{font-size:11px;line-height:1.65;color:#7b8aa5;display:flex;align-items:flex-start;gap:7px}
.dsa-legend svg{flex:none;margin-top:1px}
.dsa-topic{background:#fff;border:1px solid #e0e6f1;border-radius:15px;margin:13px 0;overflow:hidden;box-shadow:var(--shadow)}
.dsa-toggle{width:100%;background:transparent;border:0;text-align:left;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.dsa-toggle:hover{background:#f8faff}
.dsa-topic-head{padding:18px 19px;gap:10px}
.dsa-topic-icon{display:grid;place-items:center;background:#ecf0ff;color:#5d6de4;border-radius:10px;width:35px;height:35px;flex:none}
.dsa-arrow{color:#8b9bb6;display:grid;place-items:center;flex:none}
.dsa-node-label{font-size:12px;font-weight:750;flex:1;min-width:0}
.dsa-topic-head>.dsa-node-label{font-size:15px;font-weight:825}
.dsa-node-label small{display:block;color:#9aa5b9;font-size:10px;font-weight:600;margin-top:3px}
.dsa-topic-progress{color:#7b89a5;font-size:10px;min-width:102px;text-align:right;font-weight:750}
.dsa-topic-progress .bar{height:5px;margin-top:6px}
.dsa-topic-body{border-top:1px solid #e8edf5;padding:10px 12px 14px 48px;background:#fdfdff}
.dsa-subtopic{border-left:2px solid #dce3f5;margin:9px 0}
.dsa-subtopic-head{padding:11px 12px}
.dsa-subtopic-head .dsa-node-label{font-size:12.5px}
.dsa-count{color:#96a2b4;font-size:10px;font-weight:660;white-space:nowrap}
.dsa-subtopic-body{padding:3px 0 7px 21px}
.dsa-pattern{border-left:2px solid #e7ecef;margin:6px 0}
.dsa-pattern-head{padding:9px 11px;gap:9px}
.dsa-pattern-head .dsa-node-label{font-weight:650;font-size:12px}
.dsa-problem-list{margin:2px 8px 7px 25px;border-radius:11px;border:1px solid #e8edf5;background:white;overflow:hidden}
.dsa-pattern-tools{background:#f6f8fe;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dsa-caption{font-size:10px;color:#8694ad;margin-right:auto}
.dsa-mastery{font-size:10px;color:#7485a3;display:flex;gap:7px;align-items:center;font-weight:750}
.dsa-mastery select{font-size:10px;border:1px solid #dbe2f2;border-radius:7px;color:#4d5f89;background:white;padding:5px;max-width:140px}
.dsa-question{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid #eef1f6;min-width:0}
.dsa-question a{font-size:11.5px;font-weight:680;color:#3c5180;flex:1;min-width:0;display:inline-flex;align-items:center;gap:5px}
.dsa-question a svg{flex:none;opacity:.65}
.dsa-question-no{color:#a1adc0;font-size:10px;min-width:35px}
.dsa-difficulty{font-size:10px;font-weight:800;min-width:53px;text-align:center;padding:3px 6px;border-radius:7px;background:#e6f8f0;color:#168b61}
.dsa-difficulty.medium{background:#fff3df;color:#a77b21}
.dsa-difficulty.hard{background:#fff0f0;color:#bd5d61}
.dsa-premium{color:#c18c25;font-size:10px}

function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{let d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(d&&typeof d==='object'){state={...state,...d,viewDate:dateKey(new Date())};state.dsaStatuses=filterDsaStatuses(state.dsaStatuses);state.dsaMastery=filterDsaMastery(state.dsaMastery);state.dsaEvidence=filterDsaEvidence(state.dsaEvidence);if(!TOPIC_BY_ID[state.focus])state.focus='attention';}}catch(e){}}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){toast('Could not save to browser storage. Use Export backup.')}}

const relevant=(m,role)=>role==='both'||m.track==='core'||m.track===(role==='mle'?'mle':'applied');

iv class="panel-heading"><div><h2 class="panel-title">Current focus</h2><div class="panel-sub">One topic to understand deeply</div></div>${icon('spark',17)}</div><div class="focus-card"><span class="pill ${tagClass(f.module.track)}">${roleName(f.module.track)}</span><div class="focus-name">${safe(f.title)}</div><p class="small muted" style="margin:5px 0 0">${safe(f.concepts)}</p><div class="bar" style="margin:15px 0 5px"><span style="width:${25*level(f.id)}%"></span></div><span class="tiny muted">Level ${level(f.id)} / 4 · ${['Not started','Explain','Reconstruct','Build','Transfer'][level(f.id)]}</span><div class="action-row"><button class="btn primary sm" onclick="openTopic('${f.id}')">Open topic ${icon('arrow',13)}</button><button class="btn secondary sm" onclick="setTab('curriculum')">Change</button></div></div></section><section class="panel"><div class="panel-heading"><div><h2 class="panel-title">Today's essentials</h2><div class="panel-sub">Practice, build, and question</div></div></div>${habitMarkup(dateKey(new Date()),true)}<div class="divider"></div><button class="btn secondary" style="width:100%" onclick="setTab('today')">View daily workspace ${icon('arrow',14)}</button></section><section class="panel"><div class="panel-heading"><h2 class="panel-title">Your rule for progress</h2>${icon('flask',18)}</div><p class="small" style="color:#66718a;line-height:1.75;margin:0">Don't mark a topic complete because you watched a lecture. Explain it, reconstruct its logic, build a working version, and transfer it to an unfamiliar problem.</p><div class="notice" style="margin-top:14px">A difficult concept is allowed to take multiple study sessions. This tracker measures demonstrated understanding.</div></section></div></div>`}
function heatmap(){let days=[];for(let i=27;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let key=dateKey(d);let count=Object.values(daily(key)).filter(Boolean).length+state.journal.filter(e=>e.date===key).length;days.push(`<span class="heat h${Math.min(4,count)}" title="${key}: ${count} activities" aria-label="${key}: ${count} activities"></span>`)}return `<div class="heatmap">${days.join('')}</div><div class="heat-labels"><span>4 weeks ago</span><span>Today</span></div>`}
const HABITS=[['dsa','DSA + independent problem solving','Solve, prove, and review'],['ml','One deep ML concept','Derive, reconstruct, implement'],['research','Build / experiment / reflect','Document an experiment, bug or insight']];

function curriculum(){let opts=[['both','All tracks'],['mle','ML Engineer'],['applied','Applied Scientist']];const filters=[['all','All mastery levels'],['new','Not started'],['working','In progress'],['mastered','Mastered']];let visible=modulesFor(state.activeRole).filter(m=>state.currModule==='all'||m.id===state.currModule).map(m=>({...m,shown:m.topics.filter(t=>(t[1]+' '+t[2]+' '+m.name).toLowerCase().includes(state.currSearch.toLowerCase())&&(state.currFilter==='all'||(state.currFilter==='new'&&level(t[0])===0)||(state.currFilter==='working'&&level(t[0])>0&&level(t[0])<4)||(state.currFilter==='mastered'&&level(t[0])===4)))})).filter(m=>m.shown.length);return `${head('list','Your learning curriculum','Role-specific technical skills, high-quality resources, and evidence-based mastery levels.',`<button class="btn secondary" onclick="openTopic('${state.focus}')">${icon('target')} Current focus</button>`)}<div class="seg" style="margin-bottom:20px">${opts.map(([id,label])=>`<button class="${state.activeRole===id?'active':''}" onclick="setRole('${id}')">${label}</button>`).join('')}</div><div class="searchline"><div class="searchbox">${icon('search')}<input aria-label="Search topics" id="searchTopics" placeholder="Search topics, concepts, skills…" value="${safe(state.currSearch)}" oninput="currSearchChanged(this.value)"></div><select class="select" aria-label="Mastery filter" onchange="state.currFilter=this.value;persist();render()">${filters.map(([v,t])=>`<option value="${v}" ${state.currFilter===v?'selected':''}>${t}</option>`).join('')}</select><select class="select" aria-label="Module filter" onchange="state.currModule=this.value;persist();render()"><option value="all">All modules</option>${modulesFor(state.activeRole).map(m=>`<option value="${m.id}" ${state.currModule===m.id?'selected':''}>${safe(m.name)}</option>`).join('')}</select></div>${visible.length?visible.map(m=>`<section class="module ${state.closed.includes(m.id)?'closed':''}"><button class="module-header" onclick="toggleModule('${m.id}')" aria-expanded="${!state.closed.includes(m.id)}"><span class="module-icon ${tagClass(m.track)}">${icon(m.icon,19)}</span><div><div class="module-name">${safe(m.name)}</div><div class="module-desc">${safe(m.desc)} · ${roleName(m.track)}</div></div><div class="module-count">${m.topics.filter(t=>level(t[0])===4).length}/${m.topics.length} mastered<div class="bar ${tagClass(m.track)}"><span style="width:${progress(m.topics.map(t=>t[0]))}%"></span></div></div><span class="chevron">⌄</span></button><div class="topic-list">${m.shown.map(t=>`<div class="topic-row"><span class="topic-status s${level(t[0])}">${level(t[0])===4?icon('check',15):level(t[0])}</span><div class="topic-info"><strong>${safe(t[1])}</strong><p>${safe(t[2])}</p></div><span class="topic-meta">${['Not started','Explain','Reconstruct','Build','Transfer'][level(t[0])]}</span><button class="topic-open" aria-label="Open ${safe(t[1])}" onclick="openTopic('${t[0]}')">${icon('arrow')}</button></div>`).join('')}</div></section>`).join(''):`<div class="empty">No topics match the current filters. Try resetting the search.</div>`}<div class="footnote">Mastery scale: 0 Not started · 1 Explain · 2 Reconstruct · 3 Build · 4 Transfer. Click a topic to record evidence.</div>`}
function currSearchChanged(v){state.currSearch=v;persist();let cursor=document.getElementById('searchTopics')?.selectionStart;render();let el=document.getElementById('searchTopics');if(el){el.focus();el.setSelectionRange(cursor,cursor)}}
function toggleModule(id){state.closed=state.closed.includes(id)?state.closed.filter(x=>x!==id):[...state.closed,id];persist();render()}
function openTopic(id,first=true){let t=TOPIC_BY_ID[id];if(!t)return;let m=t.module;let selected=level(id);let html=`<button class="icon-btn drawer-close" onclick="closeTopic()" aria-label="Close topic">${icon('close')}</button><div class="eyebrow" style="margin-top:24px">${safe(m.name)} · ${roleName(m.track)}</div><h2>${safe(t.title)}</h2><p class="small">${safe(t.concepts)}</p><span class="pill ${tagClass(m.track)}">${roleName(m.track)}</span>${state.focus===id?' <span class="pill">Current focus</span>':''}<section class="drawer-section"><h3>What you need to demonstrate</h3><div class="notice">${safe(t.goal)}</div><div class="divider"></div><h3>Mastery level</h3><div class="level-grid">${['Not yet','Explain','Rebuild','Build','Transfer'].map((name,i)=>`<button class="level-btn ${selected===i?'active':''}" onclick="setLevel('${id}',${i})" aria-label="Set mastery to ${name}" aria-pressed="${selected===i}"><strong>${i===4?'★':i}</strong><span>${name}</span></button>`).join('')}</div><div class="level-legend">0 = new · 1 = explain intuitively · 2 = reconstruct from first principles · 3 = implement independently · 4 = apply to unfamiliar cases or experiments</div></section><section class="drawer-section"><h3>Recommended learning resources</h3>${m.r.map(key=>{let r=RES[key];return `<a class="resource-box" href="${r[2]}" target="_blank" rel="noopener noreferrer"><span>${safe(r[0])}<small>${safe(r[1])}</small></span>${icon('external',15)}</a>`}).join('')}</section><section class="drawer-section"><label class="field-label" for="topicNote">Mastery evidence / learning notes</label><textarea class="textarea" id="topicNote" placeholder="What can you now derive, implement, or explain? Paste results, mistakes, GitHub links, or experiment findings.">${safe(state.notes[id]||'')}</textarea><div class="btn-row" style="margin-top:12px"><button class="btn primary" onclick="saveNote('${id}')">${icon('check')} Save evidence</button><button class="btn secondary" onclick="setFocus('${id}');openTopic('${id}',false)">${icon('target')} ${state.focus===id?'Focused':'Focus on this'}</button></div></section>`;document.getElementById('drawer').innerHTML=html;document.getElementById('drawerBackdrop').classList.add('open');document.body.style.overflow='hidden';if(first)document.getElementById('drawer').scrollTop=0}
function saveNote(id){state.notes[id]=document.getElementById('topicNote').value;persist();toast('Your notes were saved locally')}
function closeTopic(){document.getElementById('drawerBackdrop').classList.remove('open');document.body.style.overflow='';render()}

// DSA: four collapsible levels, canonical progress by problem ID.
const DSA_STATUSES=[['todo','Not started'],['attempted','Attempted'],['hint','Solved with hint'],['solved','Solved independently'],['reviewed','Solved again on review']];
const DSA_MASTERY=['Not started','Explain','Recognize','Implement','Transfer'];
const dsaRecord=id=>(state.dsaStatuses||{})[id]||{status:'todo',attempts:0};
const dsaGood=id=>['solved','reviewed'].includes(dsaRecord(id).status);
const dsaSolvedCount=()=>Object.keys(DSA_QUESTIONS).filter(dsaGood).length;
const dsaMasteredCount=()=>Object.values(state.dsaMastery||{}).filter(n=>Number(n)===4).length;
const dsaKey=(kind,...parts)=>[kind,...parts].join(':').replace(/:(.*)/,(_,rest)=>':'+rest);
const dsaOpen=k=>Boolean((state.dsaExpanded||{})[k]);
function dsaToggle(k){state.dsaExpanded??={};state.dsaExpanded[k]=!dsaOpen(k);persist();render()}
function dsaFoldAll(expand){state.dsaExpanded={};if(expand){DSA_TOPICS.forEach(t=>{state.dsaExpanded['topic:'+t.name]=true;t.subtopics.forEach(s=>{state.dsaExpanded['sub:'+t.name+'|'+s.name]=true;s.patterns.forEach(p=>state.dsaExpanded['pattern:'+t.name+'|'+s.name+'|'+p.name]=true)})})}persist();render()}
function dsaFoldTopicsOnly(){state.dsaExpanded={};persist();render()}
function dsaFoldToSubtopics(){state.dsaExpanded={};DSA_TOPICS.forEach(t=>state.dsaExpanded['topic:'+t.name]=true);persist();render()}
function dsaFoldToPatterns(){state.dsaExpanded={};DSA_TOPICS.forEach(t=>{state.dsaExpanded['topic:'+t.name]=true;t.subtopics.forEach(s=>state.dsaExpanded['sub:'+t.name+'|'+s.name]=true)});persist();render()}
function dsaSetStatus(id,value){if(!DSA_QUESTIONS[id]||!DSA_STATUSES.some(s=>s[0]===value))return;let rec=dsaRecord(id);state.dsaStatuses??={};state.dsaStatuses[id]={...rec,status:value,attempts:(rec.attempts||0)+1,updated:dateKey(new Date())};persist();render();toast('Problem status saved')}
function dsaSetMastery(key,value){const v=Number(value);if(v<0||v>4||!Number.isInteger(v))return;state.dsaMastery??={};state.dsaMastery[key]=v;persist();render();toast('Pattern mastery updated')}
function dsaSaveEvidence(key){const ta=document.getElementById('dsaNote');if(!ta)return;state.dsaEvidence??={};state.dsaEvidence[key]=ta.value;persist();toast('Evidence saved')}
function dsaEvidencePanel(key,pattern){let details=document.getElementById('dsaEvidencePanel');if(!details)return;details.hidden=false;details.innerHTML=`<div class="dsa-notes-title"><strong>${safe(pattern)}</strong><button class="text-link" onclick="document.getElementById('dsaEvidencePanel').hidden=true">Close</button></div><p class="small muted">What did you independently explain, implement, or transfer to an unseen problem?</p><textarea id="dsaNote" class="textarea" placeholder="Write your reasoning, key insights, mistakes, invariants, and links to code...">${safe(state.dsaEvidence?.[key]||'')}</textarea><div class="btn-row" style="margin-top:9px"><button class="btn primary sm" onclick="dsaSaveEvidence('${safe(key).replace(/&#39;/g,'\\\'')}')">Save evidence</button></div>`;details.scrollIntoView({block:'nearest',behavior:'smooth'})}
function dsaSearchChanged(value){state.dsaSearch=value;const term=value.toLowerCase().trim();if(term){DSA_TOPICS.forEach(t=>t.subtopics.forEach(s=>s.patterns.forEach(p=>{if(dsaMatches(p,s,t,term)){state.dsaExpanded['topic:'+t.name]=true;state.dsaExpanded['sub:'+t.name+'|'+s.name]=true;state.dsaExpanded['pattern:'+t.name+'|'+s.name+'|'+p.name]=true}})))}persist();const p=document.getElementById('dsaSearch');const sel=p?.selectionStart;render();const el=document.getElementById('dsaSearch');if(el){el.focus();try{el.setSelectionRange(sel,sel)}catch(e){}}}
function dsaSetDifficulty(value){state.dsaDifficulty=value;persist();render()}
function dsaSetView(value){state.dsaView=value;persist();render()}
function dsaProblemsFor(p){return p.questions.filter(id=>{const q=DSA_QUESTIONS[id];return q&&companyMatches(q)&&(state.dsaDifficulty==='all'||q.difficulty===state.dsaDifficulty)&&(state.dsaView!=='unsolved'||!dsaGood(id))})}
function dsaMatches(p,s,t,term){const matchedCompany=(!catalogCompanyFilter&&!catalogTagSearch)||p.questions.some(id=>DSA_QUESTIONS[id]&&companyMatches(DSA_QUESTIONS[id]));if(!matchedCompany)return false;if(!term)return true;const hay=(t.name+' '+s.name+' '+p.name+' '+p.questions.map(id=>{const q=DSA_QUESTIONS[id];return q?(q.title+' '+(q.topics||[]).join(' ')+' '+Object.keys(q.companies||{}).join(' ')):''}).join(' ')).toLowerCase();return hay.includes(term)}
function dsaPct(p){const ids=[...new Set(p)];return ids.length?Math.round(100*ids.filter(dsaGood).length/ids.length):0}
function dsaPatternMarkup(t,s,p,searching){const key='pattern:'+t.name+'|'+s.name+'|'+p.name,open=dsaOpen(key),ids=dsaProblemsFor(p),pct=dsaPct(p.questions),m=Number(state.dsaMastery?.[key]||0);const label=p.questions.length+' question'+(p.questions.length!==1?'s':'');return `<div class="dsa-pattern" id="pat-${slugify(key)}"><button class="dsa-toggle dsa-pattern-head" onclick="dsaToggle('${jsQuote(key)}')" aria-expanded="${open}" aria-label="${open?'Collapse':'Expand'} ${safe(p.name)}"><span class="dsa-arrow">${icon(open?'down':'right',15)}</span><span class="dsa-node-label">${safe(p.name)}</span><span class="dsa-count">${p.questions.filter(dsaGood).length}/${p.questions.length} solved</span></button>${open?`<div class="dsa-problem-list"><div class="dsa-pattern-tools"><span class="dsa-caption">${label} · ${pct}% solved independently</span><label class="dsa-mastery">Pattern mastery <select aria-label="Mastery for ${safe(p.name)}" onchange="dsaSetMastery('${jsQuote(key)}',this.value)">${DSA_MASTERY.map((n,i)=>`<option value="${i}" ${i===m?'selected':''}>${i}: ${n}</option>`).join('')}</select></label><button class="text-link" onclick="dsaEvidencePanel('${jsQuote(key)}','${jsQuote(p.name)}')">${icon('book',13)} Notes</button></div>${ids.length?ids.map(id=>dsaProblemMarkup(id)).join(''):'<div class="dsa-none">No questions match the current difficulty/status filter.</div>'}</div>`:''}</div>`}
function dsaProblemMarkup(id){const q=DSA_QUESTIONS[id],rec=dsaRecord(id),url=q.url||'https://leetcode.com/problems/'+q.slug+'/';const co=Object.keys(q.companies||{});return `<div class="dsa-question"><span class="dsa-question-no">${/^\d+$/.test(String(q.id))?'#'+q.id:'LC'}</span><a href="${safe(url)}" target="_blank" rel="noopener noreferrer" title="Solve on LeetCode">${safe(q.title)} ${icon('arrow',12)}</a><span class="dsa-difficulty ${q.difficulty.toLowerCase()}">${q.difficulty}</span>${q.premium?'<span class="dsa-premium">Premium</span>':''}${co.length?`<button class="dsa-co" onclick="showCompanyTags('${jsQuote(id)}',this)" title="Show company tags and source topics">${co.length} companies</button>`:'<span class="catalog-source-flag">Curated</span>'}${String(id).startsWith('lc-')?`<button class="dsa-co" onclick="dsaClassificationPanel('${jsQuote(id)}')" title="Review and correct topic-pattern classification">${q.userClassified?'✓ Reviewed':'Review pattern'}</button>`:''}<select aria-label="Status for question ${safe(q.title)}" class="dsa-status" onchange="dsaSetStatus('${jsQuote(id)}',this.value)">${DSA_STATUSES.map(([v,n])=>`<option value="${v}" ${rec.status===v?'selected':''}>${n}</option>`).join('')}</select></div>`}
function dsaSubtopicMarkup(t,s,searching){const key='sub:'+t.name+'|'+s.name,open=dsaOpen(key),pats=s.patterns.filter(p=>dsaMatches(p,s,t,searching));const ids=[...new Set(s.patterns.flatMap(p=>p.questions))];if(searching&&!pats.length)return '';return `<section class="dsa-subtopic"><button class="dsa-toggle dsa-subtopic-head" onclick="dsaToggle('${jsQuote(key)}')" aria-expanded="${open}"><span class="dsa-arrow">${icon(open?'down':'right',17)}</span><span class="dsa-node-label">${safe(s.name)}</span><span class="dsa-count">${s.patterns.length} patterns · ${ids.filter(dsaGood).length}/${ids.length} solved</span></button>${open?`<div class="dsa-subtopic-body">${pats.map(p=>dsaPatternMarkup(t,s,p,searching)).join('')}</div>`:''}</section>`}
function dsaTopicMarkup(t,searching){const key='topic:'+t.name,open=dsaOpen(key),subs=t.subtopics.filter(s=>!searching||s.patterns.some(p=>dsaMatches(p,s,t,searching))),ids=[...new Set(t.subtopics.flatMap(s=>s.patterns.flatMap(p=>p.questions)))],patterns=t.subtopics.reduce((n,s)=>n+s.patterns.length,0);if(searching&&!subs.length)return '';return `<article class="dsa-topic"><button class="dsa-toggle dsa-topic-head" onclick="dsaToggle('${jsQuote(key)}')" aria-expanded="${open}"><span class="dsa-topic-icon">${icon('code',17)}</span><span class="dsa-arrow">${icon(open?'down':'right',19)}</span><span class="dsa-node-label">${safe(t.name)}<small>${t.subtopics.length} subtopics · ${patterns} patterns</small></span><span class="dsa-topic-progress">${ids.filter(dsaGood).length}/${ids.length} solved<div class="bar"><span style="width:${dsaPct(ids)}%"></span></div></span></button>${open?`<div class="dsa-topic-body">${subs.map(s=>dsaSubtopicMarkup(t,s,searching)).join('')}</div>`:''}</article>`}
function dsaView(){const all=Object.keys(DSA_QUESTIONS).length,search=(state.dsaSearch||'').toLowerCase().trim();const narrowed=Boolean(search||catalogCompanyFilter||catalogTagSearch),topics=DSA_TOPICS.filter(t=>!narrowed||t.subtopics.some(s=>s.patterns.some(p=>dsaMatches(p,s,t,search))));const patternCount=DSA_TOPICS.reduce((n,t)=>n+t.subtopics.reduce((x,s)=>x+s.patterns.length,0),0),subCount=DSA_TOPICS.reduce((n,t)=>n+t.subtopics.length,0);return `${head('code','DSA Pattern Library','Collapse any level: Topics → Subtopics → Patterns → LeetCode questions. Mastery and question progress persist.',`<a class="btn secondary" href="https://leetcode-companywise-questions.vercel.app/" target="_blank" rel="noopener noreferrer">Company-wise index ${icon('arrow',14)}</a>`)}<div class="dsa-metrics"><div><strong>${DSA_TOPICS.length}</strong><span>Topics</span></div><div><strong>${subCount}</strong><span>Subtopics</span></div><div><strong>${patternCount}</strong><span>Patterns</span></div><div><strong>${dsaSolvedCount()} / ${all}</strong><span>Independently solved</span></div><div><strong>${dsaMasteredCount()}</strong><span>Mastered patterns</span></div></div>${catalogPanel()}<div class="dsa-workbench"><div class="dsa-workbench-intro"><div><strong>Control the hierarchy</strong><p>Choose how much detail you want to see. Collapsing anything never changes mastery or question status.</p></div><div class="dsa-fold-actions"><button class="btn secondary sm" onclick="dsaFoldTopicsOnly()">Topics only</button><button class="btn secondary sm" onclick="dsaFoldToSubtopics()">Show subtopics</button><button class="btn secondary sm" onclick="dsaFoldToPatterns()">Show patterns</button><button class="btn secondary sm" onclick="dsaFoldAll(true)">Expand all</button><button class="btn secondary sm" onclick="dsaFoldAll(false)">Collapse all</button></div></div><div class="searchline"><label class="searchbox">${icon('search',15)}<input id="dsaSearch" aria-label="Search DSA topics patterns or questions" placeholder="Search: graph, BFS, sliding window, question…" value="${safe(state.dsaSearch||'')}" oninput="dsaSearchChanged(this.value)"></label><select class="select" aria-label="Filter question difficulty" onchange="dsaSetDifficulty(this.value)">${['all','Easy','Medium','Hard'].map(k=>`<option value="${k}" ${state.dsaDifficulty===k?'selected':''}>${k==='all'?'All difficulties':k}</option>`).join('')}</select><select class="select" aria-label="Filter question status" onchange="dsaSetView(this.value)"><option value="all" ${state.dsaView==='all'?'selected':''}>All questions</option><option value="unsolved" ${state.dsaView==='unsolved'?'selected':''}>Not independently solved</option></select></div><div class="dsa-legend">${icon('target',15)} Problems are organized in a suggested learning order. One problem can appear in multiple patterns; its progress is shared everywhere. Historical company tags are imported from the credited public CSV source when available.</div></div><div id="dsaEvidencePanel" class="dsa-evidence" hidden></div>${topics.length?topics.map(t=>dsaTopicMarkup(t,narrowed)).join(''):'<div class="empty">No pattern or question matches that search. Try another term.</div>'}<div class="footnote">A problem counts as solved only after an independent solution. Revisiting it as “solved again on review” also counts. Pattern mastery is recorded separately from the number of questions solved.</div>`}
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-')}
function jsQuote(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')}
function filterDsaStatuses(o){if(!o||typeof o!=='object')return {};let out={};Object.entries(o).forEach(([id,v])=>{if(!(DSA_QUESTIONS[id]||/^lc-[a-z0-9-]+$/.test(id))||!v||typeof v!=='object')return;let status=DSA_STATUSES.some(s=>s[0]===v.status)?v.status:'todo';out[id]={status,attempts:Math.max(0,Math.min(10000,parseInt(v.attempts)||0)),updated:typeof v.updated==='string'?v.updated:''}});return out}
function filterDsaMastery(o){if(!o||typeof o!=='object')return {};return Object.fromEntries(Object.entries(o).filter(([k,v])=>k.startsWith('pattern:')&&Number.isInteger(v)&&v>=0&&v<=4))}
function filterDsaEvidence(o){if(!o||typeof o!=='object')return {};return Object.fromEntries(Object.entries(o).filter(([k,v])=>k.startsWith('pattern:')&&typeof v==='string').map(([k,v])=>[k,v.slice(0,20000)]))}

function today(){let d=dateKey(new Date()),f=TOPIC_BY_ID[state.focus],count=Object.values(daily(d)).filter(Boolean).length;return `${head('calendar',"Today's workspace",'Deep work over clock-watching. Choose worthwhile outcomes, then record what you actually understood.',`<button class="btn primary" onclick="setTab('journal')">${icon('plus')} Add learning note</button>`)}<div class="cols"><div style="display:grid;gap:18px;align-content:start"><section class="panel"><div class="panel-heading"><div><h2 class="panel-title">Your three daily practices</h2><div class="panel-sub">${count} of 3 marked today. Adjust the depth to fit the difficulty of the concept.</div></div><span class="pill teal">${count}/3</span></div>${habitMarkup(d)}<div class="divider"></div><div class="notice">Checking a habit records that you did meaningful work, not that you completed a topic. Mastery is recorded separately in the curriculum.</div></section><section class="panel"><div class="panel-heading"><h2 class="panel-title">Focused concept</h2><span class="pill">Level ${level(f.id)} / 4</span></div><h3 style="margin:0 0 5px">${safe(f.title)}</h3><p class="small muted">${safe(f.concepts)}</p><div class="focus-card"><strong style="font-size:12px">A worthwhile outcome for today</strong><p class="small muted" style="margin-bottom:0">${safe(f.goal)}</p></div><div class="action-row"><button class="btn primary" onclick="openTopic('${f.id}')">Open focused topic</button><button class="btn secondary" onclick="setTab('curriculum')">Browse topics</button></div></section></div><div style="display:grid;gap:18px;align-content:start"><section class="panel"><div class="panel-heading"><h2 class="panel-title">Recent consistency</h2>${icon('chart')}</div>${heatmap()}<p class="footnote">A mark represents a practice checkbox or journal note, not hours spent.</p></section><section class="panel"><h2 class="panel-title">Small reflection</h2><p class="small muted">Before closing your study day, ask yourself:</p><ul clas function parseCompanyCSV(str){let out=[],row=[],cell='',quote=false;for(let i=0;i<str.length;i++){const ch=str[i];if(quote){if(ch==='"'&&str[i+1]==='"'){cell+='"';i++}else if(ch==='"')quote=false;else cell+=ch}else if(ch==='"')quote=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell.replace(/\r$/,''));out.push(row);row=[];cell=''}else cell+=ch;}if(cell.length||row.length){row.push(cell);out.push(row)}return out;}

const tagChoiceFor=(topics,title)=>{let tags=new Set(topics.map(normalizeTag)); if(tags.has('database')||tags.has('sql'))return ['SQL / Database','Database (source tag)']; if(tags.has('shell'))return ['Shell / Scripting','Shell (source tag)'];

 let fine=topics.find(t=>{let tt=normalizeTag(t);return tt&&!['array','string','math','hashtable','dynamicprogramming','design','sorting','greedy','simulation'].includes(tt)&&TOPIC_ALIASES.some(([topic,aliases])=>topic===main&&aliases.includes(tt))});if(!fine){fine=topics.find(t=>TOPIC_ALIASES.some(([topic,aliases])=>topic===main&&aliases.includes(normalizeTag(t))))||topics[0]||'Other'}return [main,fine+' (verified tag)'];};

 const targetTopic=(name)=>{let found=hierarchy.find(t=>t.name===name);if(!found){found={name,subtopics:[]};hierarchy.push(found)}return found};

function catalogPanel(){const count=Object.keys(DSA_QUESTIONS).length;const co=getCompanies();const progress=Math.round(100*catalogSyncedCompanies.length/Math.max(1,catalogTotalCompanies));return `<section class="catalog-box"><div class="catalog-head"><div><strong>Verified company-wise question catalog</strong><small>Source: <a href="${COMPANY_SOURCE.repoUrl}" target="_blank" rel="noopener">${COMPANY_SOURCE.label}</a>. Original <a href="${COMPANY_SOURCE.website}" target="_blank" rel="noopener">website</a> uses a live database; this public snapshot may differ. Topic tags come from source CSVs; exact patterns are used only for the original curated set.</small></div><span class="catalog-badge" id="catalogCount">${catalogSyncedCompanies.length} companies · ${count.toLocaleString()} unique questions</span></div><div class="catalog-progress"><span id="catalogBar" style="width:${progress}%"></span></div><div id="catalogStatus" class="catalog-log ${catalogError?'catalog-error':''}">${safe(catalogProgress|| (companyRows.length?`Cached locally. ${catalogSyncedCompanies.length} company files imported.`:'First open requires internet to import the public question dataset.'))}</div><div class="catalog-controls"><button class="btn primary sm" onclick="syncCompanies(false)" ${catalogBusy?'disabled':''}>${catalogBusy?'Import running…':companyRows.length?'Resume / sync remaining':'Import all companies'}</button><button class="btn secondary sm" onclick="syncCompanies(true)" ${catalogBusy?'disabled':''}>Priority companies first</button><button class="btn secondary sm" onclick="exportCompanyCatalog()" ${companyRows.length?'':'disabled'}>Export question data</button><button class="btn secondary sm" onclick="document.getElementById('catalogImportFile').click()">Import question data</button><input id="catalogImportFile" type="file" accept=".json,application/json" style="display:none" onchange="importCompanyCatalog(event)">${catalogBusy?'<button class="btn secondary sm" onclick="catalogStop()">Stop after batch</button>':''}<select aria-label="Filter by company" onchange="catalogFilterChanged(this.value)"><option value="">All imported companies</option>${co.map(c=>`<option value="${safe(c)}" ${catalogCompanyFilter===c?'selected':''}>${safe(c)}</option>`).join('')}</select><input id="catalogTagFilter" aria-label="Filter by source topic or question" placeholder="Filter by title, source tag…" value="${safe(catalogTagSearch)}" oninput="catalogTagChanged(this.value)"></div><small class="catalog-tiny">Question counts exclude duplicate LeetCode URLs. Company tags are historical associations, not predictions. Source-tagged pattern folders are clearly marked; ambiguous problems aren't assigned to specific algorithms without verification. Use “Review pattern” to classify them after solving. All progress stays local.</small></section>`}
async function syncCompanies(priorityOnly=false){if(catalogBusy)return;catalogBusy=true;catalogAbort=false;catalogError='';catalogProgress='Checking public GitHub source…';render();let successful=0,failed=0,lastCheckpoint=0;
 try{const url=`https://api.github.com/repos/${COMPANY_SOURCE.owner}/${COMPANY_SOURCE.repo}/git/trees/${COMPANY_SOURCE.branch}?recursive=1`;let all;try{const tree=JSON.parse(await catalogFetchText(url));all=companyFilesFromTree(tree);if(all.length===0)throw new Error('GitHub tree returned no CSV files')}catch(e){all=CATALOG_PRIORITY_COMPANIES.map(company=>({company,path:company+'/5. All.csv'}));catalogProgress='GitHub directory unavailable; trying priority-company CSV files directly.';catalogUpdateUI()}catalogTotalCompanies=all.length;
 let pending=all.filter(f=>!catalogSyncedCompanies.includes(f.company));if(priorityOnly){pending=pending.filter(f=>CATALOG_PRIORITY_COMPANIES.some(x=>x.toLowerCase()===f.company.toLowerCase()))}catalogProgress=`Found ${all.length} company files. Importing ${pending.length} remaining…`;catalogUpdateUI();
 let current=0;const workers=Array.from({length:Math.min(8,pending.length)},async()=>{while(current<pending.length&&!catalogAbort){const f=pending[current++];try{const rows=await catalogFetchCompany(f);if(!rows.length)throw new Error('empty/invalid CSV');companyRows.push(...rows);catalogSyncedCompanies.push(f.company);successful++;}catch(e){failed++;catalogError='';}if((successful>0&&successful>=lastCheckpoint+20)||current===pending.length){lastCheckpoint=successful;rebuildCompanyCatalog();try{await catalogStore()}catch(e){catalogError='Browser storage not available — export a backup now'}catalogProgress=`Loaded ${catalogSyncedCompanies.length}/${all.length} companies · ${Object.keys(DSA_QUESTIONS).length.toLocaleString()} unique questions · ${failed} failed files`;catalogUpdateUI()}}});await Promise.all(workers);
 rebuildCompanyCatalog();await catalogStore().catch(e=>catalogError='Could not cache the catalog: '+e.message);catalogProgress=`${catalogAbort?'Paused':'Finished'}: ${catalogSyncedCompanies.length}/${all.length} companies, ${Object.keys(DSA_QUESTIONS).length.toLocaleString()} unique questions${failed?' · '+failed+' unavailable source files':''}.`;
 }catch(e){catalogError='Import blocked: '+e.message+'. Check your connection or retry. Public GitHub access is required.';catalogProgress=catalogError}
 finally{catalogBusy=false;render();}
}
async function initCompanyCatalog(){try{const saved=await catalogRead();if(saved&&Array.isArray(saved.rows)){companyRows=saved.rows;catalogSyncedCompanies=Array.isArray(saved.companies)?saved.companies:[];rebuildCompanyCatalog();catalogProgress='Restored imported company tags and topic labels from local browser cache.';render()}}catch(e){catalogProgress='Browser cache unavailable; public CSV import can still work.';}
 // Import verified source files automatically on first open; can pause or resume.
 if(!catalogSyncedCompanies.length)syncCompanies(false);
}
function exportCompanyCatalog(){const blob=new Blob([JSON.stringify({type:'northstar-company-catalog',source:COMPANY_SOURCE.repoUrl,rows:companyRows,companies:catalogSyncedCompanies})],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='northstar-company-question-catalog.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Question catalog exported')}
async function importCompanyCatalog(event){const f=event.target.files?.[0];if(!f)return;try{const v=JSON.parse(await f.text());if(v.type!=='northstar-company-catalog'||v.source!==COMPANY_SOURCE.repoUrl||!Array.isArray(v.rows)||!Array.isArray(v.companies))throw new Error('Unrecognized catalog format');if(v.rows.length>250000||v.companies.length>1500)throw new Error('Unreasonable catalog size');for(const x of v.rows){if(!x||typeof x.slug!=='string'||!/^[-a-z0-9]+$/.test(x.slug)||typeof x.company!=='string'||typeof x.title!=='string'||!Array.isArray(x.topics))throw new Error('Invalid question data')}if(!confirm('Replace the cached company question catalog? Your solved question statuses and mastery remain unchanged.'))return;companyRows=v.rows;catalogSyncedCompanies=v.companies;rebuildCompanyCatalog();await catalogStore();catalogProgress=`Imported ${catalogSyncedCompanies.length} company files and ${Object.keys(DSA_QUESTIONS).length} unique questions from local backup`;render();toast('Question catalog restored')}catch(e){alert('Could not import question catalog: '+e.message)}finally{event.target.value=''}}

function classOpts(arr,selected){return arr.map(v=>`<option value="${safe(v)}" ${v===selected?'selected':''}>${safe(v)}</option>`).join('')}
function dsaClassificationPanel(id){const q=DSA_QUESTIONS[id];if(!q)return;const t0=state.dsaOverrides?.[id]?.topic||q.sourceTopic||'Arrays';const tt=BASE_DSA_TOPICS.find(t=>t.name===t0)||BASE_DSA_TOPICS[0];const st0=tt.subtopics.find(x=>x.name===state.dsaOverrides?.[id]?.subtopic)||tt.subtopics[0];const pat0=st0.patterns.find(x=>x.name===state.dsaOverrides?.[id]?.pattern)||st0.patterns[0];const e=document.getElementById('dsaEvidencePanel');if(!e)return;e.hidden=false;e.innerHTML=`<div class="dsa-notes-title"><strong>Review the pattern — ${safe(q.title)}</strong><button class="text-link" onclick="document.getElementById('dsaEvidencePanel').hidden=true">Close</button></div><p class="small muted">The public dataset verifies broad LeetCode topic tags, not the exact solution strategy. Only assign a detailed pattern after you understand the problem. Changes affect classification, never company tags or solved status.</p><div class="journal-grid"><label>Topic<select id="classTopic" class="field" onchange="dsaClassTopicChanged()">${classOpts(BASE_DSA_TOPICS.map(t=>t.name),tt.name)}</select></label><label>Subtopic<select id="classSub" class="field" onchange="dsaClassSubChanged()">${classOpts(tt.subtopics.map(x=>x.name),st0.name)}</select></label></div><label style="display:block;margin-top:10px">Exact pattern<select id="classPattern" class="field">${classOpts(st0.patterns.map(x=>x.name),pat0.name)}</select></label><div class="btn-row" style="margin-top:12px"><button class="btn primary sm" onclick="dsaSaveClassification('${jsQuote(id)}')">Save reviewed classification</button><button class="btn secondary sm" onclick="dsaResetClassification('${jsQuote(id)}')">Return to source tag</button></div>`;e.scrollIntoView({block:'nearest',behavior:'smooth'})}
function dsaClassTopicChanged(){const t=BASE_DSA_TOPICS.find(x=>x.name===document.getElementById('classTopic')?.value);if(!t)return;const sub=document.getElementById('classSub');sub.innerHTML=classOpts(t.subtopics.map(x=>x.name),t.subtopics[0].name);dsaClassSubChanged()}
function dsaClassSubChanged(){const t=BASE_DSA_TOPICS.find(x=>x.name===document.getElementById('classTopic')?.value),s=t?.subtopics.find(x=>x.name===document.getElementById('classSub')?.value);if(!s)return;document.getElementById('classPattern').innerHTML=classOpts(s.patterns.map(x=>x.name),s.patterns[0].name)}
function dsaSaveClassification(id){const topic=document.getElementById('classTopic')?.value,subtopic=document.getElementById('classSub')?.value,pattern=document.getElementById('classPattern')?.value;const t=BASE_DSA_TOPICS.find(t=>t.name===topic),sub=t?.subtopics.find(s=>s.name===subtopic),pat=sub?.patterns.find(p=>p.name===pattern);if(!pat)return toast('Choose a valid pattern');state.dsaOverrides??={};state.dsaOverrides[id]={topic,subtopic,pattern};persist();rebuildCompanyCatalog();render();toast('Classification reviewed and saved')}
function dsaResetClassification(id){if(state.dsaOverrides)delete state.dsaOverrides[id];persist();rebuildCompanyCatalog();render();toast('Returned to original source tags')}
function fullCompanyTags(id){const q=DSA_QUESTIONS[id],entries=Object.entries(q.companies||{}).sort((a,b)=>(b[1]||0)-(a[1]||0)||a[0].localeCompare(b[0]));if(!entries.length)return `<div class="company-detail">No imported company associations yet. Run the catalog import.</div>`;return `<div class="company-detail"><strong>Source company tags (${entries.length})</strong><br>${entries.map(([co,f])=>`<span>${safe(co)}${f==null?'':` · ${Number(f).toFixed(1)}% source frequency`}</span>`).join('')}<br><small>Historical scraped associations from the source CSV; not verified live.</small><br><small>Source topics: ${safe((q.topics||[]).join(', ')||'Not supplied')}</small></div>`}
function showCompanyTags(id,button){const el=button.closest('.dsa-question').nextElementSibling; if(el?.classList.contains('company-detail')){el.remove();return}const div=document.createElement('div');div.innerHTML=fullCompanyTags(id);button.closest('.dsa-question').after(div.firstElementChild)}

function syllabusKey(id,ti,si){return id+'|'+ti+'|'+si}
function topicSyllabusItems(s,i){return TOPIC_SYLLABUS[s.id]?.[i]||[]}
function syllabusTopicCount(s,i){const items=topicSyllabusItems(s,i);return {done:items.reduce((a,_,j)=>a+(state.syllabusChecks?.[syllabusKey(s.id,i,j)]?1:0),0),total:items.length}}
function syllabusCompletion(s){let done=0,total=0;for(let i=0;i<s.topics.length;i++){let x=syllabusTopicCount(s,i);done+=x.done;total+=x.total}return {done,total,pct:Math.round(100*done/Math.max(1,total))}}
function validateSyllabusChecks(data){if(!data||typeof data!=='object')return {};const o={};for(const [id,sub] of Object.entries(TOPIC_SYLLABUS)){for(let i=0;i<sub.length;i++)for(let j=0;j<sub[i].length;j++){const k=syllabusKey(id,i,j);if(data[k]===true)o[k]=true}}return o}
function validateSyllabusOpen(data){if(!data||typeof data!=='object')return {};return Object.fromEntries(Object.entries(data).filter(([k,v])=>typeof k==='string'&&k.length<80&&v===true).slice(0,300))}
function syCheck(id,ti,si,checked){state.syllabusChecks??={};const k=syllabusKey(id,ti,si);if(checked)state.syllabusChecks[k]=true;else delete state.syllabusChecks[k];persist();render()}
function syTopicToggle(id,i){state.syllabusOpen??={};const k=id+'|'+i;state.syllabusOpen[k]=!(state.syllabusOpen[k]??i===0);persist();render()}
function syTopicsAll(id,expanded){state.syllabusOpen??={};const s=TRACK_SUBJECTS.find(x=>x.id===id);if(!s)return;for(let i=0;i<s.topics.length;i++)state.syllabusOpen[id+'|'+i]=expanded;persist();render()}

 const desc=role==='mle'?'Design, train, deploy and operate reliable ML systems.':'Understand models mathematically, design experiments and produce strong research.';
 const pickCourses=role==='mle'?[['numpy_docs','s_ml_coding'],['cs329s','m_systems'],['cs246','m_ranking'],['u_system','s_system_design']]:[['cs229','s_classical'],['cs336','s_llm'],['stat415','s_inference'],['u_llm','a_llmresearch']];
 const pickBooks=role==='mle'?[['ddia','s_system_design'],['kohavi','s_abtesting'],['chip','m_systems']]:[['prml','s_classical'],['kohavi','s_abtesting'],['pml_advanced','a_probmodels']];
 return `<div class="bw-track">
 <div class="bw-hero"><div class="bw-overline">CAREER TRACK / ${role==='mle'?'01':'02'}</div><h1>${title}</h1><p>${desc}</p>
   <div class="bw-metrics"><div><b>${subjects.length}</b><span>Modules</span></div><div><b>${new Set(subjects.flatMap(x=>x.resource_ids)).size}</b><span>Resources</span></div><div><b>${totals.pct}%</b><span>Study-plan progress</span></div></div>
 </div>
 <section class="bw-featured" aria-label="Featured study resources"><div class="bw-feature-head"><h2>Start studying</h2><p>Selected high-value resources. Open a module to see courses, textbooks, and the full topic-by-topic reading plan.</p></div><div class="bw-feature-grid"><div><div class="bw-feature-label">COURSES</div>${pickCourses.map(([id,sub])=>bwFeaturedCard(id,sub)).join('')}</div><div><div class="bw-feature-label">BOOKS</div>${pickBooks.map(([id,sub])=>bwFeaturedCard(id,sub)).join('')}</div></div></section>
 <div class="bw-section-tools"><div><h2>Learning modules</h2><p>Each module contains its courses, textbooks, detailed topics, subtopics, and mastery test.</p></div><div class="bw-controls"><button class="bw-outline" onclick="trackCollapseAll(false)">Expand all</button><button class="bw-outline" onclick="trackCollapseAll(true)">Collapse all</button></div></div>
 <details class="bw-jump-details"><summary>Jump to a learning module</summary><div class="bw-jump">${subjects.map(s=>`<button onclick="expandAndScroll('${s.id}')">${safe(s.title)}</button>`).join('')}</div></details>
 <div class="bw-section-label">SHARED FOUNDATIONS <span>${foundational.length} modules · progress shared between roles</span></div>
 ${foundational.map((s,i)=>trackSubject(s,i,role)).join('')}
 <div class="bw-section-label">${role==='mle'?'ML ENGINEER SPECIALIZATION':'APPLIED SCIENTIST SPECIALIZATION'} <span>${specialists.length} modules</span></div>
 ${specialists.map((s,i)=>trackSubject(s,i+foundational.length,role)).join('')}
 <div class="bw-bottom"><b>DSA is separate</b><p>Practice questions in the Topic → Subtopic → Pattern → LeetCode library. Company tags and progress stay in that section.</p><button class="bw-black-button" onclick="setTab('dsa')">Open DSA →</button></div>
 </div>`;
}
function trackCollapseAll(c){for(const s of TRACK_SUBJECTS)state.trackCollapsed[s.id]=c;persist();render()}

const localSessionLinks={};
function guessSubject(filename){const n=filename.toLowerCase();const rules=[[/bishop|pattern.recognition|prml|machine.learning.probabilistic|murphy/, 's_classical'],[/wasserman|all.of.statistics|mathematical.statistics|hogg|casella|statistical.inference|devore|probability.and.statistics/, 's_inference'],[/probability|stochastic|random.variable|blitzstein/,'s_probability'],[/linear.algebra|matrix|svd|trefethen|strang/,'s_linalg'],[/convex|optimization|nocedal|kkt/,'s_optimization'],[/transformer|language.model|llm|raschk|nlp|jurafsky|karpathy/,'s_llm'],[/distributed|kleppmann|data.intensive|consensus/,'m_distributed'],[/database|sql|dbms|postgres/,'m_data'],[/algorithms|clrs|cormen|data.structure/,'s_algorithms'],[/deep.learning|neural.network|pytorch|goodfellow/,'s_deep'],[/reinforcement|sutton|barto/,'a_rl'],[/computer.vision|szeliski|opencv/,'a_vision'],[/research|experiment|paper|scientific/,'a_experiment']];return rules.find(([re,id])=>re.test(n))?.[1]||''}
function localImport(event){let files=[...(event.target.files||[])];if(!files.length)return;trackInit();let saved=0;let pdf=files.filter(f=>/\.pdf$/i.test(f.name));for(const f of pdf.slice(0,5000)){const path=f.webkitRelativePath||f.name;if(path.length>600)continue;const id='f_'+Array.from(new TextEncoder().encode(path)).reduce((n,x)=>(Math.imul(n,31)+x)>>>0,7).toString(36);state.localLibrary[id]={name:f.name,path,subject:state.localLibrary[id]?.subject||guessSubject(path),size:f.size};if(localSessionLinks[id])URL.revokeObjectURL(localSessionLinks[id]);localSessionLinks[id]=URL.createObjectURL(f);saved++}persist();render();toast(`Indexed ${saved} PDFs (metadata only; files stay on your computer)`)}
function localAssign(id,subject){if(state.localLibrary?.[id]){state.localLibrary[id].subject=TRACK_SUBJECTS.some(s=>s.id===subject)?subject:'';persist();render()}}
function openLocalFile(id){const u=localSessionLinks[id];if(!u){toast('Please reselect your semester folder to reopen this PDF');return}window.open(u,'_blank','noopener')}
function localClear(){if(!confirm('Remove local PDF names and module mappings from Northstar? Files on your computer will NOT be changed.'))return;state.localLibrary={};Object.entries(localSessionLinks).forEach(([id,u])=>{URL.revokeObjectURL(u);delete localSessionLinks[id]});persist();render()}
function libraryView(){trackInit();const docs=Object.entries(state.localLibrary).sort((a,b)=>a[1].path.localeCompare(b[1].path)),needle=(state.librarySearch||'').toLowerCase(),shown=docs.filter(([id,d])=>(d.name+' '+d.path).toLowerCase().includes(needle)).slice(0,400);let folders=[...new Set(docs.map(([id,d])=>d.path.split('/')[0]).filter(x=>x.includes('em')||x.includes('SEM')||x.includes('Sem')))].sort();return `${head('layers','My semester library','Index your existing semester PDFs locally and attach books to their learning modules.',`<button class="btn secondary" onclick="setTab(state.activeRole==='applied'?'applied':'mle')">${icon('book')} Learning tracks</button>`)}<div class="library-top"><div class="library-title"><h2 class="panel-title">Choose your Documents folder</h2><button class="btn primary sm" onclick="document.getElementById('semesterFolder').click()">${icon('upload')} Select a folder</button></div><input type="file" id="semesterFolder" accept="application/pdf,.pdf" webkitdirectory directory multiple style="display:none" onchange="localImport(event)"><p class="small muted" style="margin:9px 0">Select <code>Documents / Sem1–Sem5</code> or a smaller Sem1–Sem5 folder. Your browser only gives access to files you choose. This app indexes PDF filenames, sizes and module mappings — not their contents. It does not upload your files anywhere.</p><div class="track-note" style="margin:9px 0">PDF links work during the current browser session. After reopening the HTML, reselect your folder to reopen local PDFs; the module mappings remain saved. Cloud-only OneDrive files may need to be downloaded to Windows first.</div><div class="library-folders">${folders.map(x=>`<span class="folder-pill">${safe(x)}</span>`).join('')||'<span class="muted small">Semester folders will appear after selection</span>'}</div><div class="library-title"><strong>${docs.length} indexed PDF files</strong>${docs.length?`<button class="btn danger sm" onclick="localClear()">Clear index</button>`:''}</div></div><div class="panel"><div class="panel-heading"><div><h2 class="panel-title">Classify and open your books</h2><div class="panel-sub">Filename suggestions are tentative: verify them before accepting.</div></div></div><div class="searchline"><div class="searchbox">${icon('search')}<input placeholder="Search file or semester…" value="${safe(state.librarySearch||'')}" oninput="state.librarySearch=this.value;librarySearchRefresh(this.value)"></div></div>${shown.length?shown.map(([id,d])=>`<div class="library-row"><div style="flex:1;min-width:190px"><div class="file-title">${safe(d.name)}</div><div class="file-path">${safe(d.path)}</div></div><select aria-label="Learning module for ${safe(d.name)}" onchange="localAssign('${id}',this.value)"><option value="">Not classified</option>${TRACK_SUBJECTS.map(s=>`<option value="${s.id}" ${d.subject===s.id?'selected':''}>${safe(s.title)}</option>`).join('')}</select><button class="btn secondary sm" onclick="openLocalFile('${id}')">Open PDF ↗</button></div>`).join(''):'<div class="empty">No local books indexed yet. Choose your Documents folder to begin.</div>'}${docs.length>shown.length?`<p class="muted tiny">Showing ${shown.length} matching files (maximum 400 on one page). Narrow your search to view more.</p>`:''}</div>`}
function librarySearchRefresh(v){state.librarySearch=v;let cursor=document.activeElement?.selectionStart||0;render();let el=document.querySelector('input[placeholder="Search file or semester…"]');if(el){el.focus();el.setSelectionRange(cursor,cursor)}}

load();trackInit();render();initCompanyCatalog();
document.getElementById('drawerBackdrop').addEventListener('click',e=>{if(e.target.id==='drawerBackdrop')closeTopic()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('drawerBackdrop').classList.contains('open'))closeTopic()});
</script>
